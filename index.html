<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭЛИАС: Игра в ассоциации</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 200, 80, 0.3), 0 25px 50px -12px rgba(0, 0, 0, 0.6); }
            50% { box-shadow: 0 0 50px rgba(255, 200, 80, 0.6), 0 25px 50px -12px rgba(0, 0, 0, 0.6); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardFlip {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(10deg) scale(0.98); }
            100% { transform: rotateY(0deg) scale(1); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 150, 50, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(150, 80, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(50, 200, 255, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .game-container {
            max-width: 860px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 50px;
            padding: 32px 32px 40px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 30px 60px -20px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 200, 100, 0.15);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-icon {
            font-size: 2.4rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 200, 80, 0.6));
        }

        .title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffd966 0%, #ff9a3c 50%, #ffd966 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 4s linear infinite;
            text-shadow: 0 0 40px rgba(255, 180, 50, 0.3);
        }

        .score-box {
            background: linear-gradient(145deg, #1e1e30, #14141f);
            padding: 14px 30px;
            border-radius: 60px;
            font-size: 1.9rem;
            font-weight: 900;
            color: #ffd966;
            box-shadow:
                inset 0 4px 10px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(255, 200, 80, 0.15),
                0 8px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 200, 80, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .score-box:hover {
            transform: scale(1.05);
        }

        .card-area {
            perspective: 1200px;
            margin-bottom: 30px;
        }

        .card {
            background: linear-gradient(145deg, #2a2a45, #1a1a2e);
            border-radius: 44px;
            padding: 60px 30px;
            text-align: center;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 2px 0 rgba(255, 255, 255, 0.06),
                0 0 0 1px rgba(255, 200, 100, 0.1);
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: all 0.3s ease;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ffd966, #ff9a3c, #ffd966, transparent);
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
        }

        .card::after {
            content: '✦';
            position: absolute;
            bottom: 16px;
            right: 24px;
            font-size: 1.2rem;
            color: rgba(255, 200, 80, 0.2);
        }

        .card.flip {
            animation: cardFlip 0.4s ease;
        }

        .word {
            font-size: 3.4rem;
            font-weight: 900;
            color: #fff8e7;
            text-shadow:
                0 0 30px rgba(255, 200, 100, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.8);
            line-height: 1.25;
            word-break: break-word;
            letter-spacing: 1px;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .word.smaller {
            font-size: 2.6rem;
        }

        .word.tiny {
            font-size: 2rem;
        }

        .controls {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .btn {
            border: none;
            padding: 18px 30px;
            border-radius: 80px;
            font-weight: 800;
            font-size: 1.15rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            flex: 1 1 160px;
            max-width: 240px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(6px) scale(0.97);
        }

        .btn-guess {
            background: linear-gradient(145deg, #6ee7a0, #34a85a);
            color: #0a2e14;
            box-shadow:
                0 10px 0 #1a5c2e,
                0 18px 30px rgba(40, 180, 90, 0.4);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .btn-guess:hover {
            box-shadow:
                0 10px 0 #1a5c2e,
                0 18px 40px rgba(60, 220, 110, 0.6);
            transform: translateY(-2px);
        }

        .btn-guess:active {
            box-shadow:
                0 4px 0 #1a5c2e,
                0 10px 20px rgba(40, 180, 90, 0.4);
        }

        .btn-next {
            background: linear-gradient(145deg, #ffd966, #ff9a3c);
            color: #3d2200;
            box-shadow:
                0 10px 0 #a05a00,
                0 18px 30px rgba(255, 160, 40, 0.4);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .btn-next:hover {
            box-shadow:
                0 10px 0 #a05a00,
                0 18px 40px rgba(255, 180, 60, 0.6);
            transform: translateY(-2px);
        }

        .btn-next:active {
            box-shadow:
                0 4px 0 #a05a00,
                0 10px 20px rgba(255, 160, 40, 0.4);
        }

        .btn-skip {
            background: linear-gradient(145deg, #ff6b6b, #c92a2a);
            color: #fff;
            box-shadow:
                0 10px 0 #7a1515,
                0 18px 30px rgba(200, 30, 30, 0.4);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .btn-skip:hover {
            box-shadow:
                0 10px 0 #7a1515,
                0 18px 40px rgba(255, 60, 60, 0.6);
            transform: translateY(-2px);
        }

        .btn-skip:active {
            box-shadow:
                0 4px 0 #7a1515,
                0 10px 20px rgba(200, 30, 30, 0.4);
        }

        .deck-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(30, 30, 48, 0.8);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 200, 80, 0.2);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
            color: #b8c0e0;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .badge:hover {
            border-color: rgba(255, 200, 80, 0.5);
            color: #ffd966;
        }

        .badge .num {
            color: #ffd966;
            font-weight: 900;
            font-size: 1.15rem;
        }

        .progress-bar {
            height: 10px;
            background: rgba(20, 20, 35, 0.9);
            border-radius: 20px;
            margin: 18px 0 8px;
            overflow: hidden;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9a3c, #ffd966, #ff9a3c);
            background-size: 200% auto;
            border-radius: 20px;
            transition: width 0.3s ease;
            animation: shimmer 2s linear infinite;
            box-shadow: 0 0 15px rgba(255, 200, 80, 0.5);
        }

        .small-hint {
            color: #7a85a8;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .small-hint kbd {
            background: rgba(255, 200, 80, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            color: #ffd966;
            font-family: monospace;
            font-style: normal;
        }

        @media (max-width: 700px) {
            .game-container {
                padding: 22px 18px 30px;
                border-radius: 36px;
            }
            .word {
                font-size: 2.3rem;
            }
            .word.smaller {
                font-size: 1.9rem;
            }
            .word.tiny {
                font-size: 1.5rem;
            }
            .btn {
                padding: 14px 18px;
                font-size: 0.95rem;
                flex: 1 1 110px;
                max-width: none;
            }
            .score-box {
                font-size: 1.4rem;
                padding: 10px 20px;
            }
            .title {
                font-size: 1.8rem;
            }
            .title-icon {
                font-size: 1.8rem;
            }
            .card {
                min-height: 250px;
                padding: 40px 20px;
            }
        }
    </style>
</head>

        const UNIQUE_CARDS = [...new Set(ALL_CARDS)];
        console.log('Всего карточек:', UNIQUE_CARDS.length);

        // ======================= СОСТОЯНИЕ ИГРЫ =======================
        let deck = [];
        let currentIndex = 0;
        let guessedCount = 0;
        let score = 0;
        let currentWord = '';

        // DOM элементы
        const cardWordEl = document.getElementById('cardWord');
        const cardElement = document.getElementById('cardElement');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const remainingCountEl = document.getElementById('remainingCount');
        const guessedCountEl = document.getElementById('guessedCount');
        const progressFill = document.getElementById('progressFill');
        const guessBtn = document.getElementById('guessBtn');
        const nextBtn = document.getElementById('nextBtn');
        const skipBtn = document.getElementById('skipBtn');

        // ======================= ФУНКЦИИ =======================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initDeck() {
            deck = shuffleArray([...UNIQUE_CARDS]);
            currentIndex = 0;
            guessedCount = 0;
            score = 0;
            updateStats();
            displayCurrentCard();
        }

        function displayCurrentCard() {
            if (deck.length === 0) {
                cardWordEl.textContent = 'Нет карточек';
                return;
            }
            if (currentIndex >= deck.length) {
                cardWordEl.textContent = '🎉 Колода пройдена! Нажми «Следующее» для рестарта';
                return;
            }
            currentWord = deck[currentIndex];
            cardWordEl.textContent = currentWord;
            cardWordEl.classList.remove('smaller', 'tiny');
            if (currentWord.length > 18) {
                cardWordEl.classList.add('tiny');
            } else if (currentWord.length > 12) {
                cardWordEl.classList.add('smaller');
            }
            cardElement.classList.remove('flip');
            void cardElement.offsetWidth;
            cardElement.classList.add('flip');
            updateStats();
        }

        function updateStats() {
            const remaining = Math.max(0, deck.length - currentIndex);
            remainingCountEl.textContent = remaining;
            guessedCountEl.textContent = guessedCount;
            scoreDisplay.textContent = score;

            const total = deck.length;
            const progressPercent = total > 0 ? ((currentIndex) / total) * 100 : 0;
            progressFill.style.width = `${progressPercent}%`;
        }

        // Обработчик "Угадали" — начисляет очки и переходит дальше
        function handleGuess() {
            if (currentIndex >= deck.length) {
                initDeck();
                return;
            }
            guessedCount++;
            score += 10;
            updateStats();
            // Переход к следующей
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                displayCurrentCard();
            } else {
                cardWordEl.textContent = '🏁 Колода закончилась! Нажми «Следующее» для рестарта';
                updateStats();
            }
        }

        // Обработчик "Следующее" — просто переход без очков
        function handleNext() {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                displayCurrentCard();
            } else {
                // Рестарт
                initDeck();
            }
        }

        // Обработчик "Пропустить" — переход без очков (как "следующее", но можно оставить логику)
        function handleSkip() {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                displayCurrentCard();
            } else {
                initDeck();
            }
        }

        // Инициализация
        window.addEventListener('load', () => {
            initDeck();
            guessBtn.addEventListener('click', handleGuess);
            nextBtn.addEventListener('click', handleNext);
            skipBtn.addEventListener('click', handleSkip);
        });

        // Горячие клавиши
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                handleNext();
            } else if (e.key === ' ') {
                e.preventDefault();
                handleGuess();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                handleSkip();
            }
        });
